name: ocr-enrich
# Extract text from primary-source documents (incl. PaddleOCR for scanned
# PDFs) and commit it under ocr_text/ for human/AI review. This workflow
# NEVER writes tldr/ai_summary itself — review happens separately.
on:
  workflow_dispatch:
    inputs:
      records:
        description: 'Record ids, space-separated, or "all" (records lacking tldr)'
        default: "all"
permissions:
  contents: write
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install OCR stack
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr
          pip install pymupdf requests
      - name: Run OCR enrichment
        run: python3 tools/ocr_enrich.py ${{ inputs.records }}
      - name: Commit extracted text
        run: |
          git config user.name "dsf-ocr"
          git config user.email "dsf-ocr@users.noreply.github.com"
          git add ocr_text/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing extracted"
          else
            git commit -m "ocr: extracted text for review"
            git push
          fi
